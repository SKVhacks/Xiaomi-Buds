# Builds the single-file XiaomiBuds.exe.
# Push a tag like v2.0.0 to publish it as a GitHub Release; run manually to just get the build artifact.
name: Build & Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file exe
        run: dotnet publish src/XiaomiBuds/XiaomiBuds.csproj -c Release -p:SingleExe=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: XiaomiBuds
          path: publish/XiaomiBuds.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: publish/XiaomiBuds.exe
          generate_release_notes: true
